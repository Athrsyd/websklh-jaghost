name: Repository Smoke Test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-check:
    name: Repo structure & secrets hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required project files
        shell: bash
        run: |
          test -f FRONTEND/package.json
          test -f FRONTEND/package-lock.json
          test -f BACKEND/composer.json
          test -f BACKEND/composer.lock
          test -f BACKEND/artisan

      - name: Check for obvious private key files
        shell: bash
        run: |
          if find . -type f \( -name '*.pem' -o -name '*.key' -o -name 'id_rsa' \) -not -path './.git/*' | grep -q .; then
            echo 'Potential private key file detected.'
            exit 1
          fi

      - name: Check .env files are not tracked
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|\.env\..+)$' | grep -v '\.example$'; then
            echo 'A real .env file appears to be tracked.'
            exit 1
          fi
