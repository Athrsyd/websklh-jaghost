name: CI - Test & Build All

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # FRONTEND JOB: Lint & Build Test
  # ============================================================================
  frontend-test:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FRONTEND

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: FRONTEND/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Run Linter
        run: npm run lint

      - name: Test Production Build (Vite)
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html
          echo "Frontend build successfully verified!"

  # ============================================================================
  # BACKEND JOB: PostgreSQL + pgvector + Laravel PHPUnit
  # ============================================================================
  backend-test:
    name: Backend (Laravel & pgvector Tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rag_knowledge
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: BACKEND

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3 with PostgreSQL extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, pgsql, zip, bcmath, curl
          coverage: none

      - name: Copy Environment Configuration
        run: cp .env.example .env

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Database Migrations (PostgreSQL + pgvector)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: rag_knowledge
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan migrate --force

      - name: Execute Backend Tests (PHPUnit)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: rag_knowledge
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'gsk_dummy_test_key' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'dummy_gemini_test_key' }}
        run: php artisan test
