name: Frontend Dev Check

on:
  push:
    paths:
      - 'FRONTEND/**'
      - '.github/workflows/frontend-dev-check.yml'
  pull_request:
    paths:
      - 'FRONTEND/**'
      - '.github/workflows/frontend-dev-check.yml'
  workflow_dispatch:

jobs:
  lint-build:
    name: Lint & Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FRONTEND

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: FRONTEND/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build app
        run: npm run build
