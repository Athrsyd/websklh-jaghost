name: Telegram Commit Notify

on:
  push:
    branches:
      - '**'

permissions: {}

jobs:
  telegram-notify:
    name: Send commit notification
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          MESSAGE: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          URL: ${{ github.event.head_commit.url }}
        shell: bash
        run: |
          SHORT_SHA="${SHA:0:7}"
          printf -v TEXT '🚀 *New commit pushed*\n\n*Repo:* %s\n*Branch:* %s\n*Author:* %s\n*Actor:* %s\n*Commit:* `%s`\n*Message:* %s\n[View commit](%s)'             "$REPOSITORY" "$BRANCH" "$AUTHOR" "$ACTOR" "$SHORT_SHA" "$MESSAGE" "$URL"

          curl --fail --silent --show-error --request POST             "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"             --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}"             --data-urlencode "text=${TEXT}"             --data-urlencode "parse_mode=Markdown"
